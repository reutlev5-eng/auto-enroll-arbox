name: Arbox Auto Booking

on:
  schedule:
    # הרצה בשעה 19:00 בשעון ישראל (16:00 UTC) בימים: ראשון, שני, חמישי, שישי ושבת
    - cron: '0 16 * * 0,1,4,5,6'
  workflow_dispatch: # מאפשר הרצה ידנית לבדיקה

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Arbox booking script
        env:
          ARBOX_USER_EMAIL: ${{ secrets.ARBOX_USER_EMAIL }}
          ARBOX_USER_PASSWORD: ${{ secrets.ARBOX_USER_PASSWORD }}
          LOCATION_NAME: "JustFit Karmia"
          ENROLLMENT_TIME: "00:00"
        run: node app.js
